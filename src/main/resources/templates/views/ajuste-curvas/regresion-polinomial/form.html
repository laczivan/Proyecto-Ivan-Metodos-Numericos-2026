<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Regresión Polinomial</title>
</head>
<body>
    <section class="container my-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-graph-up me-2"></i>Ajuste de Curvas - Regresión Polinomial</h4>
            </div>
            <div class="card-body">
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${errorMessage}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/ajuste-curvas/regresion-polinomial}" th:object="${request}" method="post">
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="grado" class="form-label fw-bold">Grado del Polinomio (2 a 4)</label>
                            <select id="grado" th:field="*{grado}" class="form-select" required>
                                <option value="2">Grado 2 (Cuadrático)</option>
                                <option value="3">Grado 3 (Cúbico)</option>
                                <option value="4">Grado 4 (Cuártico)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="numeroPuntos" class="form-label fw-bold">Cantidad de Puntos (N >= Grado + 1)</label>
                            <input type="number" id="numeroPuntos" class="form-control" th:field="*{numeroPuntos}" min="3" max="20" required />
                        </div>
                    </div>

                    <h5 class="fw-bold border-bottom pb-2">Tabla de Coordenadas (X, Y)</h5>
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover text-center align-middle" id="tablaPuntos">
                            <thead class="table-dark">
                                <tr>
                                    <th style="width: 10%;">#</th>
                                    <th>Coordenada X (Variable Independiente)</th>
                                    <th>Coordenada Y (Variable Dependiente)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="val, iterStat : *{valoresX}">
                                    <td class="fw-bold" th:text="${iterStat.count}">1</td>
                                    <td>
                                        <input type="number" step="any" class="form-control text-center" 
                                               th:field="*{valoresX[__${iterStat.index}__]}" required />
                                    </td>
                                    <td>
                                        <input type="number" step="any" class="form-control text-center" 
                                               th:field="*{valoresY[__${iterStat.index}__]}" required />
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/ajuste-curvas}" class="btn btn-secondary">
                            <i class="bi bi-x-circle me-1"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-calculator me-1"></i> Resolver
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
