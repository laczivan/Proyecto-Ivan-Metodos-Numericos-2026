<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Regresión Polinomial</title>
</head>
<body>
    <section class="container my-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="bi bi-graph-up me-2"></i>Ajuste de Curvas - Regresión Polinomial</h4>
            </div>
            <div class="card-body">
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${errorMessage}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Selector dinámico de dimensión y grado -->
                <form th:action="@{/ajuste-curvas/regresion-polinomial}" method="get" class="row g-3 mb-4 align-items-end">
                    <div class="col-md-4">
                        <label for="puntos" class="form-label fw-bold">Número de puntos (N &ge; 3):</label>
                        <!-- Usamos regresionPolinomialRequest (revisa que coincida con tu Controller) -->
                        <input type="number" id="puntos" name="puntos" class="form-control" min="3" max="50" th:value="${regresionPolinomialRequest.numeroPuntos}" />
                    </div>
                    <div class="col-md-4">
                        <label for="grado" class="form-label fw-bold">Grado del Polinomio (m):</label>
                        <select id="grado" name="grado" class="form-select">
                            <option value="2" th:selected="${regresionPolinomialRequest.grado == 2}">2 (Cuadrática)</option>
                            <option value="3" th:selected="${regresionPolinomialRequest.grado == 3}">3 (Cúbica)</option>
                            <option value="4" th:selected="${regresionPolinomialRequest.grado == 4}">4</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-outline-secondary w-100">
                            <i class="bi bi-arrow-clockwise"></i> Actualizar Tabla
                        </button>
                    </div>
                </form>

                <hr />

                <!-- Formulario principal de captura -->
                <form th:action="@{/ajuste-curvas/regresion-polinomial}" th:object="${regresionPolinomialRequest}" method="post">
                    <!-- Campos ocultos para mantener ambos valores -->
                    <input type="hidden" th:field="*{numeroPuntos}" />
                    <input type="hidden" th:field="*{grado}" />

                    <div class="table-responsive">
                        <table class="table table-bordered text-center align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th style="width: 10%;">Punto (i)</th>
                                    <th style="width: 45%;">Valor Variable X<sub>i</sub></th>
                                    <th style="width: 45%;">Valor Variable Y<sub>i</sub></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="val, iter : *{valoresX}">
                                    <td class="fw-bold" th:text="${iter.count}">1</td>
                                    <td>
                                        <input type="number" step="any" class="form-control text-center" 
                                               th:field="*{valoresX[__${iter.index}__]}" required />
                                    </td>
                                    <td>
                                        <input type="number" step="any" class="form-control text-center" 
                                               th:field="*{valoresY[__${iter.index}__]}" required />
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-play-circle"></i> Resolver
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
