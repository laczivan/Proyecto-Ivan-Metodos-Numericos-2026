<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Diferencias Divididas de Newton (Grado Máx. 4)</title>
</head>
<body>
    <section class="container my-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-graph-up me-2"></i>Diferencias Divididas de Newton (Máx. Orden 4)</h4>
            </div>
            <div class="card-body">
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${errorMessage}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/ajuste-curvas/diferencias-divididas}" th:object="${requestDTO}" method="post">
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="numeroPuntos" class="form-label fw-bold">Número de Puntos (N: 2 a 5):</label>
                            <input type="number" min="2" max="5" class="form-control" id="numeroPuntos" th:field="*{numeroPuntos}" required onchange="generarFilasPuntos()" />
                            <div class="form-text">2 puntos = Orden 1, 3 puntos = Orden 2, 4 puntos = Orden 3, 5 puntos = Orden 4.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="xEvaluar" class="form-label fw-bold">Valor X a Evaluar (Opcional):</label>
                            <input type="number" step="any" class="form-control" id="xEvaluar" th:field="*{xEvaluar}" placeholder="Ej. 2.5" />
                        </div>
                    </div>

                    <h5 class="fw-bold text-secondary mb-3">Puntos de Entrada (X, Y)</h5>
                    <div class="table-responsive">
                        <table class="table table-bordered align-middle text-center" id="tablaPuntos">
                            <thead class="table-dark">
                                <tr>
                                    <th>i</th>
                                    <th>Xi</th>
                                    <th>Yi = f(Xi)</th>
                                </tr>
                            </thead>
                            <tbody id="tbodyPuntos">
                                <!-- Filas dinámicas generadas mediante JavaScript -->
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/home}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-play-circle"></i> Resolver
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            function generarFilasPuntos() {
                const numPuntos = parseInt(document.getElementById('numeroPuntos').value) || 2;
                const tbody = document.getElementById('tbodyPuntos');
                tbody.innerHTML = '';

                for (let i = 0; i < numPuntos; i++) {
                    const tr = document.createElement('tr');

                    tr.innerHTML = `
                        <td class="fw-bold">${i}</td>
                        <td>
                            <input type="number" step="any" class="form-control" name="valoresX[${i}]" required placeholder="x${i}" />
                        </td>
                        <td>
                            <input type="number" step="any" class="form-control" name="valoresY[${i}]" required placeholder="y${i}" />
                        </td>
                    `;
                    tbody.appendChild(tr);
                }
            }
            document.addEventListener('DOMContentLoaded', generarFilasPuntos);
        </script>
    </section>
</body>
</html>
