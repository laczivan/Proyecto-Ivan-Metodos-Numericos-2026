<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Método de la Secante Modificado', ~{::main})}">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="card-title mb-0">Método de la Secante Modificado</h4>
                    </div>
                    <div class="card-body">

                        <!-- Alerta de Error Controlada -->
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${errorMessage}">Error procesando la solicitud</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="@{/raices/secante-modificada}" 
                              th:object="${secanteModificadaDTO}" 
                              method="post">

                            <!-- Valor inicial Xi -->
                            <div class="mb-3">
                                <label for="xi" class="form-label">Valor inicial (Xi)</label>
                                <input type="number" step="any" class="form-control" id="xi" 
                                       th:field="*{xi}" required>
                            </div>

                            <!-- Perturbación Sigma / Delta -->
                            <div class="mb-3">
                                <label for="sigma" class="form-label">Valor de Perturbación (Sigma / Delta)</label>
                                <input type="number" step="any" class="form-control" id="sigma" 
                                       th:field="*{sigma}" placeholder="Ej: 0.01" required>
                            </div>

                            <!-- Función F(x) -->
                            <div class="mb-3">
                                <label for="fx" class="form-label">Función F(x)</label>
                                <input type="text" class="form-control" id="fx" 
                                       th:field="*{fx}" placeholder="Ej: e^-x - x" required>
                            </div>

                            <!-- Error relativo aprox (%) -->
                            <div class="mb-3">
                                <label for="er" class="form-label">Error relativo aprox. (%)</label>
                                <input type="number" step="any" class="form-control" id="er" 
                                       th:field="*{er}" required>
                            </div>

                            <!-- Máximo de iteraciones -->
                            <div class="mb-3">
                                <label for="maximoIteraciones" class="form-label">Máximo de iteraciones</label>
                                <input type="number" class="form-control" id="maximoIteraciones" 
                                       th:field="*{maximoIteraciones}" required>
                            </div>

                            <!-- Botones de Acción -->
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-calculator"></i> Resolver
                                </button>
                                <a th:href="@{/raices}" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
