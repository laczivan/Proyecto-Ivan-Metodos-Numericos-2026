<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Solución - Método de Regla Falsa</title>
</head>
<body>
    <section class="container-fluid my-5 px-4">
        <div class="card shadow">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="bi bi-table"></i> Resultados - Método de Regla Falsa</h4>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-bordered align-middle text-center">
                        <thead class="table-dark">
                            <tr>
                                <th>Iteración</th>
                                <th>XL</th>
                                <th>XU</th>
                                <th>XR</th>
                                <th>FXL</th>
                                <th>FXU</th>
                                <th>FXR</th>
                                <th>Error Relativo (%)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="fila : ${resultados}">
                                <td th:text="${fila.iteracion}">1</td>
                                <td th:text="${#numbers.formatDecimal(fila.xl, 1, 'POINT', 6, 'POINT')}">0.000000</td>
                                <td th:text="${#numbers.formatDecimal(fila.xu, 1, 'POINT', 6, 'POINT')}">0.000000</td>
                                <td class="fw-bold text-primary" th:text="${#numbers.formatDecimal(fila.xr, 1, 'POINT', 6, 'POINT')}">0.000000</td>
                                <td th:text="${#numbers.formatDecimal(fila.fxl, 1, 'POINT', 6, 'POINT')}">0.000000</td>
                                <td th:text="${#numbers.formatDecimal(fila.fxu, 1, 'POINT', 6, 'POINT')}">0.000000</td>
                                <td th:text="${#numbers.formatDecimal(fila.fxr, 1, 'POINT', 6, 'POINT')}">0.000000</td>
                                <td th:text="${#numbers.formatDecimal(fila.er, 1, 'POINT', 6, 'POINT')} + '%'">100.000000%</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-start mt-3">
                    <a th:href="@{/raices}" class="btn btn-outline-primary">
                        <i class="bi bi-arrow-left"></i> Regresar
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
