<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Solución Newton-Raphson - Métodos Numéricos</title>
</head>
<body>
<section class="container my-4">
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
            <h3 class="card-title mb-0">Resultados del Método de Newton-Raphson</h3>
            <span class="badge bg-light text-dark" th:text="${'F(x) = ' + request.fx}">F(x)</span>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover table-bordered text-center align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Iteración</th>
                            <th>Xi</th>
                            <th>Xi+1</th>
                            <th>F(Xi)</th>
                            <th>F'(Xi)</th>
                            <th>Error Relativo (%)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="row : ${soluciones}">
                            <td th:text="${row.iteracion}">1</td>
                            <td th:text="${#numbers.formatDecimal(row.xi, 1, 6)}">0.000000</td>
                            <td th:text="${#numbers.formatDecimal(row.xi1, 1, 6)}">0.000000</td>
                            <td th:text="${#numbers.formatDecimal(row.fxi, 1, 6)}">0.000000</td>
                            <td th:text="${#numbers.formatDecimal(row.fdxi, 1, 6)}">0.000000</td>
                            <td th:text="${#numbers.formatDecimal(row.er, 1, 6)}">0.000000</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-3">
                <a th:href="@{/raices}" class="btn btn-outline-primary">Regresar</a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
