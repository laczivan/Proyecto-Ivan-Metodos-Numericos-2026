<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Método de Iteración de Punto Fijo</title>
</head>
<body>
    <section class="container my-4">
        <h2 class="mb-4 text-primary">Método de Iteración de Punto Fijo</h2>

        <!-- Contenedor para mensajes de error -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form th:action="@{/raices/puntofijo}" th:object="${puntoFijo}" method="post" class="needs-validation">
                    <div class="mb-3">
                        <label for="x0" class="form-label font-weight-bold">Valor inicial (X0)</label>
                        <input type="number" step="any" class="form-control" id="x0" th:field="*{x0}" required />
                    </div>

                    <div class="mb-3">
                        <label for="gx" class="form-label font-weight-bold">Función G(x)</label>
                        <input type="text" class="form-control" id="gx" th:field="*{gx}" placeholder="Ej: (x + 2)^(1/3)" required />
                    </div>

                    <div class="mb-3">
                        <label for="er" class="form-label font-weight-bold">Error relativo aprox. (%)</label>
                        <input type="number" step="any" class="form-control" id="er" th:field="*{er}" required />
                    </div>

                    <div class="mb-3">
                        <label for="maximoIteraciones" class="form-label font-weight-bold">Máximo de iteraciones</label>
                        <input type="number" class="form-control" id="maximoIteraciones" th:field="*{maximoIteraciones}" min="1" required />
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">Resolver</button>
                        <a th:href="@{/raices}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
