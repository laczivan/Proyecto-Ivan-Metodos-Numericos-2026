<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Solución - Método de la Secante', ~{::main})}">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <main class="container my-4">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                <h4 class="card-title mb-0">Resultados - Método de la Secante</h4>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle text-center">
                        <thead class="table-dark">
                            <tr>
                                <th>Iteración</th>
                                <th>X<sub>i-1</sub></th>
                                <th>X<sub>i</sub></th>
                                <th>X<sub>i+1</sub></th>
                                <th>f(X<sub>i-1</sub>)</th>
                                <th>f(X<sub>i</sub>)</th>
                                <th>f(X<sub>i+1</sub>)</th>
                                <th>Error Relativo (%)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${resultados}">
                                <td th:text="${row.iteracion}">1</td>
                                <td th:text="${#numbers.formatDecimal(row.xiMenos1, 1, 6)}">0.000000</td>
                                <td th:text="${#numbers.formatDecimal(row.xi, 1, 6)}">0.000000</td>
                                <td th:text="${#numbers.formatDecimal(row.xiMas1, 1, 6)}">0.000000</td>
                                <td th:text="${#numbers.formatDecimal(row.fxiMenos1, 1, 6)}">0.000000</td>
                                <td th:text="${#numbers.formatDecimal(row.fxi, 1, 6)}">0.000000</td>
                                <td th:text="${#numbers.formatDecimal(row.fxiMas1, 1, 6)}">0.000000</td>
                                <td th:text="${#numbers.formatDecimal(row.er, 1, 6)} + '%'">0.000000%</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="mt-3">
                    <a th:href="@{/raices}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Regresar
                    </a>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
