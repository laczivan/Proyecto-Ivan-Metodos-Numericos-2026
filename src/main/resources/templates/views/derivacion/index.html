<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Unidad V.- Derivación Numérica</title>
</head>
<body>
    <section class="container my-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white">
                <h3 class="mb-0">
                    <i class="bi bi-calculator me-2"></i>Unidad V.- Derivación Numérica
                </h3>
            </div>
            <div class="card-body">
                <p class="lead text-muted">
                    Aproximación de derivadas analíticas mediante esquemas de diferencias finitas (hacia adelante, hacia atrás y centradas) para órdenes de derivada de 1 a 4.
                </p>
                <hr />
                <div class="row g-4 mt-2">

                    <!-- Diferenciación Numérica -->
                    <div class="col-md-6">
                        <div class="card h-100 shadow-sm" style="border-color: #55072c;">
                            <div class="card-header text-white fw-bold" style="background-color: #b9205d;">
                                <i class="bi bi-layers-half me-2"></i>Diferenciación Numérica
                            </div>
                            <div class="list-group list-group-flush">
                                <a th:href="@{/derivacion/diferenciacion}" 
                                   class="list-group-item list-group-item-action flex-column align-items-start py-3">
                                    <div class="d-flex w-100 justify-content-between mb-1">
                                        <h6 class="mb-1 fw-bold text-dark">
                                            <i class="bi bi-cpu me-2" style="color: #8d2323;"></i> Esquemas de Diferencias Finitas
                                        </h6>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>
</body>
</html>
