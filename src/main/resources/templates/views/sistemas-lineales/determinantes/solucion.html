<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Solución - Determinante</title>
</head>
<body>
    <section class="container my-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="bi bi-calculator-fill me-2"></i>Resultado del Determinante</h4>
            </div>
            <div class="card-body">
                <!-- Bloque Destacado del Resultado -->
                <div class="alert alert-info border-0 shadow-sm">
                    <h5 class="alert-heading">Método Aplicado: <span th:text="${resultado.metodoUtilizado}">Método</span></h5>
                    <hr>
                    <h2 class="mb-0">
                        det(A) = <strong class="text-primary" th:text="${#numbers.formatDecimal(resultado.determinante, 1, 'POINT', 4, 'POINT')}">0.0000</strong>
                    </h2>
                </div>

                <!-- Representación Visual de la Matriz Ingresada -->
                <h5 class="mt-4 fw-bold">Matriz A (<span th:text="${resultado.dimension} + 'x' + ${resultado.dimension}"></span>):</h5>
                <div class="table-responsive">
                    <table class="table table-bordered text-center align-middle mx-auto font-monospace" style="max-width: 400px;">
                        <tbody>
                            <tr th:each="row : ${resultado.matrizOriginal}">
                                <td th:each="val : ${row}" th:text="${#numbers.formatDecimal(val, 1, 'POINT', 2, 'POINT')}">0.00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Traza Matemática de la Solución -->
                <h5 class="mt-4 fw-bold"><i class="bi bi-list-ol me-2"></i>Desarrollo Paso a Paso:</h5>
                <ul class="list-group list-group-flush border rounded">
                    <li class="list-group-item font-monospace" th:each="paso : ${resultado.pasosDesarrollo}" th:text="${paso}">Paso del algoritmo</li>
                </ul>

                <!-- Acciones -->
                <div class="d-flex justify-content-start mt-4">
                    <a th:href="@{/sistemas-lineales/determinantes(dim=${resultado.dimension})}" class="btn btn-outline-primary">
                        <i class="bi bi-arrow-left me-1"></i> Regresar
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
