<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Solución - Eliminación Gaussiana</title>
</head>
<body>
    <section class="container my-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="bi bi-cpu me-2"></i>Solución del Sistema de Ecuaciones</h4>
            </div>
            <div class="card-body">
                <!-- Bloque Destacado del Vector Solución X -->
                <div class="alert alert-success border-0 shadow-sm text-dark">
                    <h5 class="alert-heading fw-bold">Vector Solución Final (X):</h5>
                    <div class="d-flex flex-wrap gap-3 mt-2">
                        <div class="bg-white p-2 px-3 rounded border font-monospace fs-5" th:each="val, iter : ${resultado.vectorSolucionX}">
                            <strong class="text-primary" th:text="'x' + ${iter.index + 1} + ' = '">x1 = </strong>
                            <span th:text="${#numbers.formatDecimal(val, 1, 'POINT', 4, 'POINT')}">0.0000</span>
                        </div>
                    </div>
                </div>

                <!-- Comparativa de Matrices -->
                <div class="row mt-4">
                    <div class="col-md-6">
                        <h6 class="fw-bold text-center">Matriz Aumentada Original [A | B]</h6>
                        <div class="table-responsive">
                            <table class="table table-bordered text-center align-middle font-monospace">
                                <tbody>
                                    <tr th:each="row, rStat : ${resultado.matrizAOriginal}">
                                        <td th:each="val : ${row}" th:text="${#numbers.formatDecimal(val, 1, 'POINT', 2, 'POINT')}">0.00</td>
                                        <td class="table-active fw-bold text-primary" 
                                            th:text="${#numbers.formatDecimal(resultado.vectorBOriginal[rStat.index], 1, 'POINT', 2, 'POINT')}">0.00</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <h6 class="fw-bold text-center text-success">Matriz Triangular Superior [A' | B']</h6>
                        <div class="table-responsive">
                            <table class="table table-bordered text-center align-middle font-monospace border-success">
                                <tbody>
                                    <tr th:each="row, rStat : ${resultado.matrizATriangular}">
                                        <td th:each="val : ${row}" th:text="${#numbers.formatDecimal(val, 1, 'POINT', 4, 'POINT')}">0.0000</td>
                                        <td class="table-success fw-bold text-dark" 
                                            th:text="${#numbers.formatDecimal(resultado.vectorBTriangular[rStat.index], 1, 'POINT', 4, 'POINT')}">0.0000</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Traza de Procedimiento Paso a Paso -->
                <h5 class="mt-4 fw-bold"><i class="bi bi-list-ol me-2"></i>Traza y Procedimiento Matemático:</h5>
                <div class="bg-dark text-light p-3 rounded font-monospace" style="max-height: 400px; overflow-y: auto;">
                    <pre class="mb-0" th:each="paso : ${resultado.pasosDesarrollo}" th:text="${paso}">Paso de la ejecución</pre>
                </div>

                <div class="d-flex justify-content-start mt-4">
                    <a th:href="@{/sistemas-lineales/eliminacion-gaussiana(dim=${resultado.dimension})}" class="btn btn-outline-warning">
                        <i class="bi bi-arrow-left me-1"></i> Regresar
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
