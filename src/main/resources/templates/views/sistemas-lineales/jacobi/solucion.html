<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Solución - Método de Jacobi</title>
</head>
<body>
    <section class="container-fluid my-4 px-4">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="bi bi-check-circle-fill text-success me-2"></i>Resultados - Método Iterativo de Jacobi</h4>
                <span class="badge bg-primary fs-6" th:text="${resultado.dimension + 'x' + resultado.dimension}">3x3</span>
            </div>
            <div class="card-body">

                <!-- Observaciones -->
                <div class="mb-4">
                    <div th:each="obs : ${resultado.observaciones}" 
                         class="alert alert-info alert-dismissible fade show" role="alert">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        <span th:text="${obs}">Observación</span>
                    </div>
                </div>

                <!-- Solución Final -->
                <div class="row g-3 mb-4">
                    <div class="col-md-12">
                        <div class="card bg-light border-success">
                            <div class="card-body">
                                <h5 class="card-title fw-bold text-success mb-3"><i class="bi bi-bullseye me-2"></i>Vector Solución Final [X]</h5>
                                <div class="row text-center">
                                    <div class="col" th:each="val, iterStat : ${resultado.vectorSolucionX}">
                                        <div class="p-3 bg-white border rounded shadow-sm">
                                            <span class="text-muted d-block small" th:text="'x' + ${iterStat.index + 1}">x1</span>
                                            <span class="fs-4 fw-bold text-primary" 
                                                  th:text="${#numbers.formatDecimal(val, 1, 'POINT', 6, 'POINT')}">0.000000</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tabla de Iteraciones -->
                <h5 class="fw-bold mb-3"><i class="bi bi-table me-2"></i>Tabla de Convergencia por Iteraciones</h5>
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-bordered align-middle text-center">
                        <thead class="table-dark">
                            <tr>
                                <th>Iteración</th>
                                <th th:each="j : ${#numbers.sequence(1, resultado.dimension)}" th:text="'x' + ${j}">x1</th>
                                <th>Error Relativo Max. (%)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="fila : ${resultado.iteraciones}">
                                <td class="fw-bold" th:text="${fila.iteracion}">1</td>
                                <td th:each="val : ${fila.vectorX}" 
                                    th:text="${#numbers.formatDecimal(val, 1, 'POINT', 6, 'POINT')}">0.000000</td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${fila.errorRelativo < 1.0} ? 'bg-success' : 'bg-warning text-dark'"
                                          th:text="${#numbers.formatDecimal(fila.errorRelativo, 1, 'POINT', 6, 'POINT')} + '%'">0.000000%</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Botón de retorno -->
                <div class="d-flex justify-content-start mt-4">
                    <a th:href="@{/sistemas-lineales/jacobi}" class="btn btn-outline-primary">
                        <i class="bi bi-arrow-left me-1"></i>Regresar a Formulario
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
