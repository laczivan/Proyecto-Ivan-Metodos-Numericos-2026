<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Solución - Simpson 1/3</title>
</head>
<body>
    <section class="container my-4">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Resultados del Método de Simpson 1/3</h4>
            </div>
            <div class="card-body text-center">
                <div class="row">
                    <div class="col-md-4">
                        <h5>Integral Exacta</h5>
                        <p class="fs-4 text-primary" th:text="${respuesta.integralExacta}"></p>
                    </div>
                    <div class="col-md-4">
                        <h5>Integral Aproximada</h5>
                        <p class="fs-4 text-success fw-bold" th:text="${respuesta.integralAproximada}"></p>
                    </div>
                    <div class="col-md-4">
                        <h5>Error Relativo (%)</h5>
                        <p class="fs-4 text-danger" th:text="${#numbers.formatDecimal(respuesta.errorRelativo, 1, 4)} + '%'"></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">Tabla de Puntos Evaluados</div>
                    <div class="card-body p-0">
                        <table class="table table-striped table-hover mb-0 text-center">
                            <thead class="table-secondary">
                                <tr>
                                    <th>i</th>
                                    <th>xi</th>
                                    <th>f(xi)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="punto : ${respuesta.tablaPuntos}">
                                    <td th:text="${#numbers.formatInteger(punto.i, 1)}"></td>
                                    <td th:text="${#numbers.formatDecimal(punto.x, 1, 4)}"></td>
                                    <td th:text="${#numbers.formatDecimal(punto.fx, 1, 4)}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-dark text-white">Pasos del Desarrollo</div>
                    <div class="card-body">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item" th:each="paso : ${respuesta.pasosDesarrollo}" th:text="${paso}"></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4 text-end">
            <a th:href="@{/integracion/simpson13}" class="btn btn-primary">Regresar al Formulario</a>
        </div>
    </section>
</body>
</html>
