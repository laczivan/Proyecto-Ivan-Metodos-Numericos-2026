<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Integración Múltiple</title></head>
<body>
    <section class="container my-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white"><h4 class="mb-0">Integración Múltiple (2 Variables)</h4></div>
            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <form th:action="@{/integracion/multiple}" th:object="${multipleRequest}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Función f(x,y)</label>
                        <input type="text" class="form-control" th:field="*{fxy}" placeholder="Ej. x^2 + y^2" required>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3"><label>Límite ax</label><input type="number" step="any" class="form-control" th:field="*{ax}" required></div>
                        <div class="col-md-4 mb-3"><label>Límite bx</label><input type="number" step="any" class="form-control" th:field="*{bx}" required></div>
                        <div class="col-md-4 mb-3"><label>Segmentos nx</label><input type="number" class="form-control" th:field="*{nx}" required></div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3"><label>Límite ay</label><input type="number" step="any" class="form-control" th:field="*{ay}" required></div>
                        <div class="col-md-4 mb-3"><label>Límite by</label><input type="number" step="any" class="form-control" th:field="*{by}" required></div>
                        <div class="col-md-4 mb-3"><label>Segmentos ny</label><input type="number" class="form-control" th:field="*{ny}" required></div>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/integracion}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Resolver</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
