<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--modifique linea 8 en lugar de replace puse text-->
    <title th:text="${title}">Métodos Numéricos</title>
    
    <!-- Bootstrap 5 CSS mediante WebJars -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Fragmento de Barra de Navegación -->
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <!-- Contenido Dinámico de las Vistas -->
    <main class="flex-shrink-0 my-4">
        <div th:replace="${content}">
            <p>Contenido por defecto</p>
        </div>
    </main>

    <!-- Fragmento de Pie de Página -->
    <footer th:replace="~{fragments/footer :: footer}" class="mt-auto"></footer>

    <!-- Bootstrap 5 JS Bundle via WebJars -->
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
